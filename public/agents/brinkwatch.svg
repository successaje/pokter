<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 980" width="980" height="980" role="img" aria-label="Brinkwatch by Pokter">
  <!--
    Brinkwatch by Pokter: Pokter's proof tile with the gates in its corner,
    and a radar sweep: the distance to liquidation, watched. One mark per house agent, the same family: the tile
    and the gates say whose agent it is, the glyph says which. Drawn to read
    at the 40px a list renders it, so no lettering and nothing finer than
    the glyph's stroke. Served as a file because the ERC-8004 registration
    points at this URL.
  -->
