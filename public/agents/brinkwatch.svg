  <g fill="#16171a" transform="translate(118, 104) scale(0.36)"><path d="M192 62H513Q545 62 545 94V168Q545 200 513 200H344Q332 200 332 212V752H192Q160 752 160 720V94Q160 62 192 62Z"/><path d="M592 62H716Q820 62 820 166V546Q820 648 716 648H457Q425 648 425 616V562Q425 530 457 530H640Q652 530 652 518V258Q652 246 640 246H592Z"/></g>
  <g transform="translate(398, 398) scale(0.8) translate(-250, -250)"><g fill="none" stroke="#16171a" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"><path d="M250 480A250 250 0 0 1 500 730"/><path d="M250 270A460 460 0 0 1 710 730"/><path d="M280 700L650 310"/></g><circle cx="280" cy="700" r="56" fill="#16171a"/></g>
