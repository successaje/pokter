name: Probe sweep

# Keeps the deployed track record growing. Evidence that stops accumulating
# stops being evidence — an agent's uptime claim is only as current as the last
# time somebody checked.
on:
  schedule:
    # Every two hours. Frequent enough that a day's outage cannot hide between
    # samples, sparse enough to stay a good citizen toward third-party endpoints.
    - cron: '17 */2 * * *'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger sweep
        run: |
          response=$(curl -sS -w '\n%{http_code}' --max-time 480 \
            -X POST "https://pokter.fly.dev/api/sweep" \
            -H "authorization: Bearer ${{ secrets.SWEEP_SECRET }}")

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)

          echo "$body"

          if [ "$status" != "200" ]; then
            echo "::error::Sweep failed with HTTP $status"
            exit 1
          fi

          # A sweep that recorded nothing is a failed sweep, however it exited.
          probes=$(echo "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('probes',0))")
          if [ "$probes" -eq 0 ]; then
            echo "::error::Sweep recorded no probes"
            exit 1
          fi
          echo "Recorded $probes probes"

      # A sweep invalidates nothing, but a deploy empties the in-memory cache,
      # and the first visitor after that pays for every registry lookup the
      # aggregate pages need — measured at 31s for the leaderboard against ~1s
      # warm. Judges browse freely and will not wait, so the scheduled run also
      # pays that cost on their behalf.
      - name: Warm the aggregate pages
        continue-on-error: true
        run: |
          for path in \
            "/" \
            "/leaderboard" \
            "/leaderboard?category=grid-trading" \
            "/leaderboard?category=rebalancing" \
            "/leaderboard?category=yield" \
            "/leaderboard?category=health-factor" \
            "/agents" \
            "/pool-check"
          do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 \
              "https://pokter.fly.dev${path}" || echo "000")
            printf '  %-42s %s\n' "$path" "$code"
          done
