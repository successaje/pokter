name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Production is backed by a single Fly volume. Never let two image rollouts
# race over the same machine and persistent data.
concurrency:
  group: pokter-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    # Two build attempts have to fit, plus lint, types, tests and audits.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Run protocol safety checks
        run: npm run audit:protocol

      - name: Run rate-limit checks
        run: npm run audit:rate-limit

      - name: Run notification consent checks
        run: npm run audit:notifications

      # The reason this retry existed is gone: the build used to resolve
      # Newsreader and the body face over the network through
      # next/font/google, and that fetch twice returned null mid-release and
      # failed the deploy. The fonts are now committed and loaded with
      # next/font/local, so the build reaches nowhere for them.
      #
      # One retry is kept rather than none, because a build step can still
      # lose a registry read or a runner disk, and a second attempt costs
      # minutes where a false red costs a release. It is two attempts now,
      # not three — with the known flake removed there is far less to absorb,
      # and a genuine compile error should fail quickly. The warning marks
      # any run that needed the second go, so a new flake shows up as a
      # pattern instead of disappearing into a green tick.
      - name: Build production application
        run: |
          for attempt in 1 2; do
            if npm run build -- --webpack; then exit 0; fi
            echo "::warning::Build attempt ${attempt} of 2 failed; retrying in 15s"
            sleep 15
          done
          echo "::error::Build failed twice."
          exit 1

  deploy:
    name: Deploy to Fly.io
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://pokter.xyz
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Two attempts, for the reason the build step above already gives: a
      # second attempt costs minutes where a false red costs a release. The
      # build had this and the deploy did not, which is the wrong way round —
      # a build that fails leaves main undeployed and says so loudly in the
      # pull request, while a deploy that fails leaves main and production
      # silently diverged. The health check cannot see it either, since it
      # reports on the code that is running, which is fine, just old.
      #
      # On 19 October the remote builder cancelled one second in, before it
      # had read the Dockerfile: `failed to read dockerfile: context
      # canceled`. Nothing about the release was wrong, and the same commit
      # deployed on a re-run by hand, after someone noticed a red tick.
      #
      # Safe to repeat: the deploy rolls out an image built from a fixed
      # commit, the concurrency group above keeps two releases off the
      # machine, and a retry after a partial rollout rolls out the same image
      # again. The warning marks any release that needed the second go, so a
      # new flake shows up as a pattern instead of vanishing into a green tick.
      - name: Deploy
        run: |
          for attempt in 1 2; do
            if flyctl deploy --remote-only --config fly.toml; then exit 0; fi
            echo "::warning::Deploy attempt ${attempt} of 2 failed; retrying in 20s"
            sleep 20
          done
          echo "::error::Deploy failed twice."
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # `saturated` counts as serving. The health route reports three states:
      # `ok`, `saturated` for a machine that is serving badly, and `degraded`
      # for the storage faults that mean it cannot serve at all — and only
      # the last is a reason to call a release bad. Matching `ok` alone made
      # a release fail whenever the new machine happened to be busy in the
      # seconds after boot, which is when it warms its caches and runs its
      # first sweep. A green deploy that turns on the timing of a sweep is
      # not a check, it is a coin toss.
      - name: Verify production health
        run: |
          response=$(curl --fail --silent --show-error \
            --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 20 https://pokter.xyz/api/health)
          echo "$response" | grep -qE '"status":"(ok|saturated)"'
          if echo "$response" | grep -q '"status":"saturated"'; then
            echo "::warning::Released, but the machine reports saturated serving: $response"
          fi
          # The sweep runs probes, notifications, reminders and liquidation alerts.
          # On 20 October a Fly secret switched its scheduler off and it stayed off
          # for about twenty hours with every check here passing.
          scheduler=$(echo "$response" | grep -o '"scheduler":"[a-z-]*"' | cut -d'"' -f4)
          if [ "$scheduler" != "on" ]; then
            echo "::error::The sweep scheduler is ${scheduler:-not reported} on production. A Fly secret named SWEEP_SCHEDULER overrides fly.toml; unset it."
            exit 1
          fi

      - name: Verify critical public journeys
        run: |
          for path in / /discover /agents /build /account
          do
            code=$(curl --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 3 \
              --max-time 30 --output /dev/null --write-out '%{http_code}' \
              "https://pokter.xyz${path}")
            if [ "$code" != "200" ]; then
              echo "::error::${path} returned HTTP ${code}"
              exit 1
            fi
          done

      - name: Verify escrow on each chain
        # Hires are funded per agent on the escrow that can pay its price, so a
        # regression can break one chain while every page still answers 200.
        # Read-only: each check reads a fixed fact from chain or the public API.
        run: |
          get() {
            curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 3 \
              --max-time "${2:-30}" "$1"
          }
          status() {
            curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 3 \
              --max-time 60 --output /dev/null --write-out '%{http_code}' "$1"
          }

          activity=$(get https://pokter.xyz/api/v1/activity)
          echo "$activity" | jq -e '.buyers and .teamWallets and (.byChain | any(.chainId == 97))' > /dev/null \
            || { echo '::error::/api/v1/activity lost its buyers, teamWallets or testnet breakdown'; exit 1; }

          # A Pokter job on testnet reads back; a job another marketplace made
          # on the mainnet escrow is found there and refused as not Pokter's.
          code=$(status 'https://pokter.xyz/api/jobs/1424?chain=97')
          [ "$code" = "200" ] || { echo "::error::Testnet job lookup returned ${code}"; exit 1; }

          if grep -q "NEXT_PUBLIC_ESCROW_CHAINS = '97,56'" fly.toml; then
            echo "$activity" | jq -e '.byChain | any(.chainId == 56)' > /dev/null \
              || { echo '::error::Mainnet is enabled but /api/v1/activity has no mainnet breakdown'; exit 1; }

            code=$(status 'https://pokter.xyz/api/jobs/56975?chain=56')
            [ "$code" = "404" ] || { echo "::error::Mainnet job lookup returned ${code}, expected 404 for a non-Pokter job"; exit 1; }

            # A mainnet-priced agent with a way to deliver on testnet offers both ways
            # to hire: the network switch on its hire page holds a BNB Chain and a
            # Testnet option. Brinkwatch, Pokter's own agent, delivers on testnet from
            # its own testnet registration (56/374107 -> 97/2618). An agent that only
            # answers a relayed brief with a price is correctly offered mainnet alone,
            # so a third-party agent cannot stand in here: whether it refuses the relay
            # is its builder's choice, and changes this page.
            # Matched on the switch's markup, not on prose, so a copy change cannot fail a release.
            hire=$(get https://pokter.xyz/hire/56/374107 90)
            echo "$hire" | grep -q 'aria-label="Network"' \
              && echo "$hire" | grep -qE 'role="radio"[^>]*>BNB Chain<' \
              && echo "$hire" | grep -qE 'role="radio"[^>]*>Testnet<' \
              || { echo '::error::A mainnet-priced agent no longer offers both mainnet and the free testnet hire'; exit 1; }
          fi

      - name: Verify production discovery signals
        run: |
          robots=$(curl --fail --silent --show-error --max-time 20 \
            https://pokter.xyz/robots.txt)
          sitemap=$(curl --fail --silent --show-error --max-time 30 \
            https://pokter.xyz/sitemap.xml)
          homepage=$(curl --fail --silent --show-error --max-time 30 \
            https://pokter.xyz/)

          echo "$robots" | grep -q 'Sitemap: https://pokter.xyz/sitemap.xml'
          echo "$sitemap" | grep -q '<loc>https://pokter.xyz</loc>'
          echo "$homepage" | grep -Eq 'rel="canonical" href="https://pokter\.xyz/?"'
          echo "$homepage" | grep -q 'application/ld+json'

          if printf '%s\n%s' "$robots" "$sitemap" | grep -q 'localhost'; then
            echo '::error::Production discovery metadata contains localhost URLs'
            exit 1
          fi
