# Pokter — BNB Chain agent marketplace.
app = 'pokter'
primary_region = 'iad'

[build]
  # Compiled into the client bundle, not read from the machine at runtime.
  # See the Dockerfile's builder stage for why these cannot live in [env].
  [build.args]
    NEXT_PUBLIC_APP_URL = 'https://pokter.xyz'
    NEXT_PUBLIC_PASSKEY_RP_ID = 'pokter.xyz'
    NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID = 'd8f9d3b75a1facd7447f8440becd4093'
    # Hires of agents that sign a price in mainnet $U are funded on the BNB
    # Chain escrow, with real money; everything else stays on testnet.
    # Remove to return to testnet only. See src/lib/network/escrow.ts.
    NEXT_PUBLIC_ESCROW_CHAINS = '97,56'
    # New currencies for hires on BNB Chain, enabled one at a time for the
    # owner-led test session (docs/release/test-session.md). Public while on.
    # Remove a pair and redeploy to stop new hires in it; funded jobs keep
    # their token, settlement and recovery.
    NEXT_PUBLIC_HIRE_TOKENS = '56:0x55d398326f99059fF775485246999027B3197955,56:0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d'

[env]
  PORT = '8080'
  # Databases live on the mounted volume so probe history, sessions and jobs
  # survive deploys. This is the reason for a volume rather than a stateless
  # serverless deploy: the accumulated track record *is* the evidence layer.
  PROBE_DB_PATH = '/data/probes.db'
  SESSION_DB_PATH = '/data/sessions.db'
  JOB_DB_PATH = '/data/jobs.db'
  DELIVERABLE_DB_PATH = '/data/deliverables.db'
  RATE_LIMIT_DB_PATH = '/data/rate-limit.db'
  NOTIFICATION_DB_PATH = '/data/notifications.db'
  REVIEW_DB_PATH = '/data/reviews.db'
  BUILDER_DB_PATH = '/data/builders.db'
  FUNDER_DB_PATH = '/data/funders.db'
  ASSAY_DB_PATH = '/data/assay.db'
  QUEST_DB_PATH = '/data/quest.db'
  CONVERSION_DB_PATH = '/data/conversion.db'
  SEAL_DB_PATH = '/data/seals.db'
  WALLET_ACTIVITY_DB_PATH = '/data/wallet-activity.db'
  CAPABILITY_DB_PATH = '/data/capability.db'
  FEEDBACK_DB_PATH = '/data/feedback.db'
  BRIEF_DB_PATH = '/data/briefs.db'
  PROFILE_DB_PATH = '/data/profiles.db'
  MAINTENANCE_DB_PATH = '/data/maintenance.db'
  SATURATION_DB_PATH = '/data/saturation.db'
  TRADING_DB_PATH = '/data/trading.db'
  HIRE_ATTEMPT_DB_PATH = '/data/hire-attempts.db'
  PROVIDER_DB_PATH = '/data/provider.db'
  X402_DB_PATH = '/data/x402.db'
  # The server schedules its own probe sweeps (src/lib/history/scheduler.ts);
  # GitHub's cron is the backup. Set only here, so no other host sweeps.
  SWEEP_SCHEDULER = 'on'
  ALTANA_NETWORK = 'bnb-testnet'
  # The public origin. demo-seller writes this into the deliverable URL it
  # commits on chain, so it must match the live host before anything delivers.
  NEXT_PUBLIC_APP_URL = 'https://pokter.xyz'
  # Pins passkeys to the apex so a credential created on www still signs on
  # the bare domain. Without it the rpId follows whichever host was typed.
  NEXT_PUBLIC_PASSKEY_RP_ID = 'pokter.xyz'

[http_service]
  internal_port = 8080
  force_https = true
  # Never suspended. With suspend enabled, a gap between visits let the machine
  # sleep and the next request paid resume *plus* a cold registry re-fetch —
  # measured at 84s after an otherwise-warm start. During judging the machine
  # stays up so the first visitor is never the one who pays for it.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 40
    hard_limit = 80

[[vm]]
  # A shared CPU was not enough, and the measurement is worth keeping.
  #
  # On 20 October the site flapped and then stopped serving. The cause was
  # not load the app created: `/proc/stat` showed the hypervisor taking
  # **88.1%** of the CPU in steal, leaving the guest about 7% of one core.
  # A static file took seconds; the homepage returned 502. Load sat at 1.6
  # on one core with 1.5GB of 2GB free, so it was neither memory nor GC.
  #
  # Measured again on `performance-1x` over fifty minutes, sweeps off and
  # code unchanged: steal 0.10%, event-loop p99 25ms median against 8607ms,
  # 46 of 46 checks healthy, no saturation episode opened. Steal on a shared
  # CPU can come from quota throttling or from competition on the host and
  # these numbers do not say which; a dedicated CPU removes the shared quota
  # rather than guaranteeing no steal at all.
  #
  # This is a mitigation, not a fix. The homepage still costs roughly 0.7s
  # more than a static file at the median, and whether that is CPU or
  # waiting on an upstream is not yet measured — a dedicated core absorbs it
  # either way, which is what makes it easy to leave unfixed. Revisit the
  # size once that delay is understood.
  size = 'performance-1x'
  # 2GB: the machine crashed at 1GB during a sweep, and was scaled by hand
  # without this file, so every deploy put it back to 1GB. The same thing
  # happened to the CPU above on 20 October, which is why the size is pinned
  # here and not left to `fly scale`.
  memory = '2gb'

[mounts]
  source = 'pokter_data'
  destination = '/data'

[checks]
  [checks.health]
    type = 'http'
    port = 8080
    method = 'GET'
    path = '/api/health'
    interval = '30s'
    timeout = '10s'
    grace_period = '20s'
