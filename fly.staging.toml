# Pokter staging: the release-validation app for verified-token hiring.
#
# Separate from production in everything that signs or stores: its own app,
# its own volume, its own secrets (fresh keys, never production's), and only
# BNB Testnet. Production deploys from fly.toml; nothing deploys this file
# automatically. See docs/release/hire-tokens.md, section 9.
#
#   fly deploy --config fly.staging.toml --app pokter-staging
app = 'pokter-staging'
primary_region = 'iad'

[build]
  [build.args]
    NEXT_PUBLIC_APP_URL = 'https://pokter-staging.fly.dev'
    NEXT_PUBLIC_PASSKEY_RP_ID = 'pokter-staging.fly.dev'
    # Testnet only: no real money moves through staging.
    NEXT_PUBLIC_ESCROW_CHAINS = '97'
    # The token under rehearsal, on testnet only.
    NEXT_PUBLIC_HIRE_TOKENS = '97:0x337610d27c682E347C9cD60BD4b3b107C9d34dDd'

[env]
  PORT = '8080'
  PROBE_DB_PATH = '/data/probes.db'
  SESSION_DB_PATH = '/data/sessions.db'
  JOB_DB_PATH = '/data/jobs.db'
  DELIVERABLE_DB_PATH = '/data/deliverables.db'
  RATE_LIMIT_DB_PATH = '/data/rate-limit.db'
  NOTIFICATION_DB_PATH = '/data/notifications.db'
  REVIEW_DB_PATH = '/data/reviews.db'
  BUILDER_DB_PATH = '/data/builders.db'
  FUNDER_DB_PATH = '/data/funders.db'
  ASSAY_DB_PATH = '/data/assay.db'
  QUEST_DB_PATH = '/data/quest.db'
  CONVERSION_DB_PATH = '/data/conversion.db'
  SEAL_DB_PATH = '/data/seals.db'
  WALLET_ACTIVITY_DB_PATH = '/data/wallet-activity.db'
  CAPABILITY_DB_PATH = '/data/capability.db'
  FEEDBACK_DB_PATH = '/data/feedback.db'
  BRIEF_DB_PATH = '/data/briefs.db'
  PROFILE_DB_PATH = '/data/profiles.db'
  MAINTENANCE_DB_PATH = '/data/maintenance.db'
  SATURATION_DB_PATH = '/data/saturation.db'
  TRADING_DB_PATH = '/data/trading.db'
  HIRE_ATTEMPT_DB_PATH = '/data/hire-attempts.db'
  PROVIDER_DB_PATH = '/data/provider.db'
  X402_DB_PATH = '/data/x402.db'
  # No scheduled sweeps of the whole registry from staging; the rehearsal
  # agent is checked on demand.
  SWEEP_SCHEDULER = 'off'
  ALTANA_NETWORK = 'bnb-testnet'
  NEXT_PUBLIC_APP_URL = 'https://pokter-staging.fly.dev'
  NEXT_PUBLIC_PASSKEY_RP_ID = 'pokter-staging.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  # Stopped when idle, to cost nothing between rehearsals.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  # No scheduled sweeps, but the rehearsal forces one after settlement so
  # status, receipts and earnings catch up, and production crashed at 1GB
  # during a sweep. A shared core is enough for one buyer.
  size = 'shared-cpu-1x'
  memory = '2gb'

[mounts]
  source = 'pokter_staging_data'
  destination = '/data'

[checks]
  [checks.health]
    type = 'http'
    port = 8080
    method = 'GET'
    path = '/api/health'
    interval = '30s'
    timeout = '10s'
    grace_period = '20s'
